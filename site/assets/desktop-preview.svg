<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">DS-Harness Desktop runtime window</title>
  <desc id="desc">A dark desktop window showing the local runtime ready state and pinned source identity.</desc>
  <defs>
    <linearGradient id="window" x1="160" y1="60" x2="1120" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#182536"/>
      <stop offset="1" stop-color="#090d14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(842 372) rotate(151) scale(540 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#376ea5" stop-opacity=".42"/>
      <stop offset="1" stop-color="#376ea5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="80" y="0" width="1120" height="760" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect width="1280" height="760" rx="32" fill="#070a0f"/>
  <rect width="1280" height="760" rx="32" fill="url(#glow)"/>
  <g opacity=".2" stroke="#6f94bb">
    <path d="M0 120h1280M0 240h1280M0 360h1280M0 480h1280M0 600h1280"/>
    <path d="M160 0v760M320 0v760M480 0v760M640 0v760M800 0v760M960 0v760M1120 0v760"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="120" y="70" width="1040" height="620" rx="22" fill="url(#window)" stroke="#54789f" stroke-opacity=".65"/>
    <path d="M120 126h1040" stroke="#4a6684"/>
    <circle cx="158" cy="98" r="7" fill="#69839e"/><circle cx="184" cy="98" r="7" fill="#69839e"/><circle cx="210" cy="98" r="7" fill="#69839e"/>
    <text x="640" y="104" fill="#9bb1c8" font-family="ui-sans-serif,system-ui" font-size="15" text-anchor="middle">DS-Harness Desktop</text>
    <rect x="164" y="170" width="270" height="474" rx="16" fill="#0b1119" stroke="#344b65"/>
    <rect x="192" y="200" width="42" height="42" rx="11" fill="#1c344d" stroke="#5480ac"/>
    <text x="213" y="227" fill="#cce7ff" font-family="ui-sans-serif,system-ui" font-weight="700" font-size="17" text-anchor="middle">DSH</text>
    <text x="252" y="218" fill="#edf6ff" font-family="ui-sans-serif,system-ui" font-size="17">Runtime</text>
    <text x="252" y="239" fill="#7890aa" font-family="ui-monospace,monospace" font-size="12">local supervisor</text>
    <rect x="192" y="284" width="214" height="1" fill="#26394d"/>
    <circle cx="202" cy="323" r="5" fill="#6cb5f5"/>
    <text x="220" y="328" fill="#b9d6f0" font-family="ui-monospace,monospace" font-size="14">runtime.ready</text>
    <text x="192" y="382" fill="#70859b" font-family="ui-sans-serif,system-ui" font-size="12">LOCAL ORIGIN</text>
    <text x="192" y="408" fill="#b8cce0" font-family="ui-monospace,monospace" font-size="13">127.0.0.1 : auto</text>
    <text x="192" y="466" fill="#70859b" font-family="ui-sans-serif,system-ui" font-size="12">DESKTOP</text>
    <text x="192" y="492" fill="#b8cce0" font-family="ui-monospace,monospace" font-size="13">v0.1.5</text>
    <text x="192" y="550" fill="#70859b" font-family="ui-sans-serif,system-ui" font-size="12">UPSTREAM</text>
    <text x="192" y="576" fill="#b8cce0" font-family="ui-monospace,monospace" font-size="13">47f943859bef</text>
    <rect x="472" y="170" width="644" height="474" rx="16" fill="#0d141e" stroke="#344b65"/>
    <text x="510" y="215" fill="#8499ae" font-family="ui-monospace,monospace" font-size="13">DSH WEB / SESSION</text>
    <text x="510" y="278" fill="#eef6ff" font-family="ui-sans-serif,system-ui" font-size="29" font-weight="600">Everything is still a plugin.</text>
    <text x="510" y="318" fill="#91a5ba" font-family="ui-sans-serif,system-ui" font-size="16">The Desktop owns the window. Harness owns the agent.</text>
    <rect x="510" y="368" width="568" height="1" fill="#273a4d"/>
    <text x="510" y="418" fill="#719bc3" font-family="ui-monospace,monospace" font-size="14">$ dsh web --host 127.0.0.1 --port 0</text>
    <text x="510" y="460" fill="#bcd4ea" font-family="ui-monospace,monospace" font-size="14">✓ profile composed</text>
    <text x="510" y="496" fill="#bcd4ea" font-family="ui-monospace,monospace" font-size="14">✓ plugins mounted</text>
    <text x="510" y="532" fill="#bcd4ea" font-family="ui-monospace,monospace" font-size="14">✓ local UI ready</text>
    <rect x="510" y="574" width="164" height="38" rx="19" fill="#dceeff"/>
    <text x="592" y="598" fill="#08111b" font-family="ui-sans-serif,system-ui" font-size="14" font-weight="700" text-anchor="middle">Open workspace</text>
  </g>
</svg>
